  header_setup_authorized: true               # AUTHORISED 2026-11-01 by the Phase 3B master task after the two user-confirmed security gates (D-039); one-time setup (docs/phase3-draft-destination.md section 11) NOT authorised
  headers_verified: true             # set 2026-11-01 after the one-time setup and a read-back of Sheet1!A1:U1 (21 headers exact, plain-text columns A B F O P Q, row 1 frozen, rows 2-3 empty); D-039
  writes_enabled: false              # was enabled 2026-11-01 only to replace the three older-skill draft bodies (rows 3, 11, 13) on the user's explicit authorisation (D-047); set back to false. Re-enable only for an approved run
  gmail_enabled: false               # Phase 3 never uses Gmail
  scheduled_execution: false         # Phase 3 is manually initiated

