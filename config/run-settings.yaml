# Run settings read by the scheduled task at PREFLIGHT (workflows/daily-post-call-run.md §1).
# Non-secret only. No API keys or credentials exist in the primary architecture (connectors use OAuth).
# Status: proposed values; nothing reads this file yet (no scheduled task is configured).

delivery_mode: dry_run            # dry_run | test | shadow | live  (D-022) — only live emails customers
go_live_date: null                # YYYY-MM-DD call date from which the agent is the designated sender; required for live
recipient_allowlist: []           # internal addresses; required for test mode
target_date_override: null        # YYYY-MM-DD for manual reruns; must be before today (Asia/Kolkata)

timezone: Asia/Kolkata
target_date_offset_days: 1        # previous calendar day (D-013)
discovery_lookback_days: 2        # D-018
transcript_wait_days: 1           # D-019
max_followup_age_days: 7          # OD-10
max_records_per_run: 25           # bounds context and Claude plan usage (R-09)
fetch_window_rows: 300            # bounded read from the end of Calls DONE (Phase 1 F2); extended if the coverage check fails
max_attempts: 3                   # OD-14
lease_minutes: 30
run_lock_minutes: 120             # R-08

source:
  # AGENT INPUT = the original spreadsheet "CSC  Booking - All Agents" (D-029). It is the only operational source.
  spreadsheet_id: 1jRNPM4GJ4ctV5lgUVzyJhhq15tFdnT3jZ5TjHsAPbsI
  worksheet: Calls DONE
  worksheet_gid: 1314582701
  call_id_column: AD                # PROPOSED Call ID column; NOT approved for writing (see source_writes_enabled)
  call_id_header: POST_CALL_CALL_ID # PROPOSED header; not approved
  # All source writes stay disabled until every condition in docs/call-id-strategy.md section 0 is met:
  # AD ownership confirmed, header approved, protected ranges verified, backup synchronisation confirmed not to erase agent data.
  source_writes_enabled: false
  protected_ranges_verified: false  # must be true before ANY write to Calls DONE (R-03, OD-36); set only after Google is seen to reject a forbidden write from the connector account

# Recovery copy only. NOT an agent input and never read or written by the agent (D-029). Synchronisation is documented
# separately (docs/backup-recovery.md) and is not part of agent execution. Its reliability is unverified.
backup:
  role: recovery_copy_only
  spreadsheet_id: 10YjhBUPpJBEnbXz5zTqGoXEIVEIuuMZT4cCyiYJ7p3Q   # CSC Booking - Backup
  worksheet: Calls DONE

logs:
  spreadsheet_id: null            # OD-18 (same spreadsheet or separate); worksheets not yet created
  logs_worksheet: POST_CALL_EMAIL_LOGS
  events_worksheet: POST_CALL_EMAIL_EVENTS

# Phase 3 draft destination (D-035, proposed; Phase 3 NOT approved or started). The only place generated drafts may be written.
# Never the source and never the backup. Not inspected yet: worksheet name, headers, access and rows are unknown.
draft_destination:
  spreadsheet_id: 1_TxhedZ_sPTLXGPo36pFnoSNDCIWHU8uRtmhfXm2L40
  worksheet_gid: 0
  worksheet: null                    # unknown until the read-only inspection (docs/phase3-draft-destination.md section 3)
  schema_version: p3-draft-v1-proposed
  headers_verified: false            # set true only after inspection matches the approved schema
  writes_enabled: false              # set true only after Phase 3 approval, OD-12 approval, and inspection (no Call ID column is required, D-036)
  gmail_enabled: false               # Phase 3 never uses Gmail
  scheduled_execution: false         # Phase 3 is manually initiated
