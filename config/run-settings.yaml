  schema_confirmed: true
  real_transcript_processing_approved: true   # explicit user approval 2026-11-01 (D-037, OD-12)
  customer_data_storage_approved: true        # names, emails, Fathom URLs, subjects, bodies in this sheet; explicit user approval 2026-11-01 (D-037, OD-19)
  retention_period: null                      # NOT decided: must follow the company's applicable data-retention policy; to be confirmed
