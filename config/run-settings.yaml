  source_access_enforced: true                # CONFIRMED BY THE USER 2026-11-01 (D-039): connector account is Viewer on the source or an equivalent Google-enforced restriction exists. NOT independently verifiable by the agent (earlier state, D-038: NOT enforced: the connector account is Editor on the source and Calls DONE has no protected ranges. Unresolved: make the account Viewer on the source, or an equivalent Google-enforced restriction (D-038)
